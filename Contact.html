<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact html </title>
    <link rel="shortcut icon" href="image/FECT.png"> 
</head>
<style>
    Body{
          background-color:yellow;
     }
</style>
<body>
     <br>
     <form action="/" method="get"></form>
     <label for="name">Naran kompletu:</label>
     <input type="text" id="name" name="name" placeholder="Naran kompletu">
     <br>
     <label for="email">Email</label>
     <input type="email" id="email" name="email"placeholder="email">
     <br>
     <label for="password">Password</label>
     <input type="password" id="password" name="Password"placeholder="password">
     <br>
     <label for="idade">Idade</label>
     <input type="number" id="idade" name="idade" min="0" max="80"placeholder="idade">
     <br>
     <label for="data">Data Moris</label>
     <input type="date" id="data" name="data">
     <br>
     <label for="Municipiu">Municipiu</label>
     <select name="Municipiu" id="Municipiu">
          <option value=""></option>
          <option value="Ermera">Ermera</option>
          <option value="Ainaro">Ainaro</option>
          <option value="Likisa">Likisa</option>
          <option value="Bobonaro">Bobonaro</option>
          <option value="Covalima">Covalima</option>
          <option value="Manatuto">Manatuto</option>
          <option value="Aileu">Aileu</option>
          <option value="Oe-Cussi">Oe-cussi</option>
          <option value="Viqueque">Viqueque</option>
          <option value="Baukau">Baukau</option>
          <option value="Lautem">Lautem</option>
          <option value="Dili">Dili</option>
          <option value="Atauro">Atauro</option>
</body>
</html>
